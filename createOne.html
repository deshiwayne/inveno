<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inveno | Create Account</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100">

<section class="min-h-screen flex">

  <!-- LEFT SIDE (Dark Professional Gradient) -->
  <div class="hidden lg:flex w-1/2 bg-gradient-to-br bg-blue-900 text-white flex-col justify-between p-16">
    
    <div>
      <h1 class="text-5xl font-bold mb-6 tracking-tight">Inveno</h1>
      <h2 class="text-2xl font-semibold mb-6 text-gray-300">
        Create Your Account
      </h2>
      <p class="text-white leading-relaxed max-w-md">
        Join Smart Inventory Exchange and take full control of your product operations,
        performance tracking and marketplace growth.
      </p>
    </div>

    <div class="text-sm text-gray-500">
      © 2026 Smart Inventory Exchange
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="flex w-full lg:w-1/2 items-center justify-center p-8">

    <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-xl border border-gray-200">

      <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Create Account</h2>
        <p class="text-gray-500 mt-2">
          Set up your access to the platform
        </p>
      </div>

      <!-- FORM -->
      <form id="signup-form" class="space-y-5">

        <!-- Full Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Full Name
          </label>
          <input 
            type="text"
            id="full-name"
            name="full_name"
            placeholder="Enter your full name"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
          />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Email Address
          </label>
          <input 
            type="email"
            id="email"
            placeholder="you@example.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>
          <input 
            type="password"
            id="password"
            placeholder="Create a password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
          />
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Confirm Password
          </label>
          <input 
            type="password"
            id="confirm-password"
            name="confirm_password"
            placeholder="Confirm your password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
          />
        </div>

        <!-- Terms -->
        <div class="flex items-start">
          <input type="checkbox" class="mt-1 h-4 w-4 border-gray-300 rounded focus:ring-gray-900">
          <label class="ml-2 text-sm text-gray-600">
            I agree to the Terms & Conditions
          </label>
        </div>

        <!-- Button -->
        <button 
          type="submit"
          class="w-full bg-gray-900 hover:bg-black text-white py-3 rounded-lg font-semibold transition">
          Create Account
        </button>

      </form>


      <!-- Error Message -->
      <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mt-4" role="alert">
        <span class="block sm:inline" id="error-text"></span>
      </div>

      <!-- Bottom Link -->
      <p class="text-center text-sm text-gray-600 mt-8">
        Already have an account?
        <a href="login.html" class="font-medium text-gray-900 hover:underline">
          Sign in
        </a>
      </p>


    </div>

  </div>

</section>

<script src="./Auth/auth.js"></script>

</body>
</html>

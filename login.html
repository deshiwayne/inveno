<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Inveno</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 min-h-screen font-sans">
  <div class="min-h-screen flex">

    <div class="hidden lg:flex lg:w-1/2 bg-blue-900 text-white p-12 flex-col justify-between">
      <div>
        <div class="w-12 h-12 text-blue-900 rounded-xl flex items-center justify-center font-bold text-xl mb-8"></div>
        <h1 class="text-4xl font-semibold leading-tight mb-6">Inveno</h1>
        <p class="text-blue-100 text-lg max-w-md">
          Manage your products, sellers and marketplace operations with complete control and clarity.
        </p>
      </div>
      <p class="text-blue-200 text-sm">© 2026 Smart Inventory Exchange</p>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center px-6 sm:px-12 py-12">
      <div class="w-full max-w-md">

        <div class="mb-8">
          <h2 class="text-2xl sm:text-3xl font-semibold text-slate-800">Welcome Back</h2>
          <p class="text-slate-500 text-sm mt-2">Sign in to continue to your dashboard</p>
        </div>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
          <span class="block sm:inline" id="error-text"></span>
        </div>

        <div id="resend-confirmation" class="hidden bg-blue-50 border border-blue-300 text-blue-800 px-4 py-3 rounded relative mb-4">
          <p class="text-sm mb-2">Haven't received your confirmation email?</p>
          <button type="button" onclick="resendConfirmationEmail(document.getElementById('email').value)" 
            class="text-blue-900 font-semibold hover:underline text-sm">
            Resend Confirmation Email
          </button>
        </div>

        <form id="login-form" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
            <input id="email" type="email" placeholder="you@example.com" required
              class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-800 transition" />
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-sm font-medium text-slate-700">Password</label>
              <a href="#" class="text-sm text-blue-800 hover:underline">Forgot password?</a>
            </div>
            <input id="password" type="password" placeholder="Enter your password" required
              class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-800 transition" />
          </div>

          <button type="submit" id="submit-btn"
            class="w-full bg-blue-900 text-white py-3 rounded-lg font-medium hover:bg-blue-800 transition">
            Sign In
          </button>
        </form>

        <div class="my-8 flex items-center">
          <div class="flex-grow h-px bg-slate-200"></div>
          <span class="px-4 text-sm text-slate-400">OR</span>
          <div class="flex-grow h-px bg-slate-200"></div>
        </div>

        <p class="text-sm text-center text-slate-600">
          Don’t have an account?
          <a href="createOne.html" id="create-account-link" class="text-blue-800 font-medium hover:underline">Create one</a>
        </p>

      </div>
    </div>
  </div>



  <script src="./Auth/auth.js"></script>
  
</body>
</html>
